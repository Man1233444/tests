<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AR Body Skeleton Tracker</title>

    <style>
        body { font-family: system-ui, -apple-system, sans-serif; background: #0a0a0c; color: white; text-align: center; margin: 0; padding: 20px; }
        h1 { font-size: 1.8rem; margin-bottom: 5px; color: #f3f4f6; }
        #status { font-weight: bold; color: #00ff88; margin-bottom: 15px; font-size: 1rem; min-height: 24px; }
        
        .box { position: relative; width: 640px; height: 480px; margin: 10px auto; background: #111; border-radius: 16px; overflow: hidden; border: 4px solid #222; box-shadow: 0 20px 40px rgba(0,0,0,0.5); }
        
        /* Mirror elements horizontally so your movement acts like a natural reflection */
        video, canvas { position: absolute; top: 0; left: 0; width: 640px; height: 480px; transform: scaleX(-1); }
        video { z-index: 1; object-fit: cover; display: block; }
        canvas { z-index: 2; pointer-events: none; }
        
        .controls { margin-bottom: 15px; }
        button { background: #00ff88; color: #0a0a0c; font-weight: bold; border: none; padding: 14px 28px; font-size: 1rem; border-radius: 8px; cursor: pointer; margin: 5px; transition: all 0.2s ease; box-shadow: 0 4px 12px rgba(0,255,136,0.2); }
        button:hover { background: #00e67a; transform: translateY(-1px); }
        button.toggle-btn { background: #222; color: #fff; border: 2px solid #444; box-shadow: none; }
        button.toggle-btn:hover { background: #333; border-color: #666; }
    </style>
</head>
<body>

    <h1>AR Body Skeleton Tracker</h1>
    <div id="status">Click "Start System" to initialize your webcam...</div>

    <div class="controls">
        <button id="start-btn">Start System</button>
        <button class="toggle-btn" id="toggle-btn">Show/Hide Camera View</button>
    </div>

    <div class="box">
        <video id="webcam" autoplay playsinline muted></video>
        <canvas id="output"></canvas>
    </div>

    <!-- Script tag configured as a module to fix the FilesetResolver error -->
    <script type="module">
        // Import components explicitly from the module bundle package
        import { PoseLandmarker, FilesetResolver } from "https://jsdelivr.net";

        const video = document.getElementById('webcam');
        const canvas = document.getElementById('output');
        const ctx = canvas.getContext('2d');
        
        let poseLandmarker;
        let showVideo = true;
        let isRunning = false;

        // Attach interface click events directly within the module scope
        document.getElementById('toggle-btn').addEventListener('click', () => {
            showVideo = !showVideo;
            video.style.display = showVideo ? 'block' : 'none';
        });

        document.getElementById('start-btn').addEventListener('click', async () => {
            if (isRunning) return;
            document.getElementById('status').innerText = 'Initializing MediaPipe Vision Core...';
            
            try {
                // Initialize the background file systems safely
                const vision = await FilesetResolver.forVisionTasks(
                    "https://jsdelivr.net"
                );

                // Compile tracking rules using local processing assets
                poseLandmarker = await PoseLandmarker.createFromOptions(vision, {
                    baseOptions: {
                        modelAssetPath: "https://googleapis.com",
                        delegate: "GPU"
                    },
                    runningMode: "VIDEO"
                });

                document.getElementById('status').innerText = 'Requesting camera device authorization...';
                
                // Prompt user for live webcam stream track allocations
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { width: 640, height: 480 },
                    audio: false
                });
                video.srcObject = stream;
                
                video.addEventListener('loadeddata', () => {
                    canvas.width = video.videoWidth;
                    canvas.height = video.videoHeight;
                    isRunning = true;
                    document.getElementById('status').innerText = 'System fully live! Step back into frame.';
                    renderLoop();
                });

            } catch (err) {
                document.getElementById('status').innerText = 'System Blocked: ' + err.message;
                console.error(err);
            }
        });

        function renderLoop() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Paint an elegant slate-grey sheet if the video view toggles off
            if (!showVideo) {
                ctx.fillStyle = '#0f0f12';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            }

            if (video.readyState >= 2 && poseLandmarker) {
                let timestamp = performance.now();
                const result = poseLandmarker.detectForVideo(video, timestamp);

                if (result.poseLandmarks && result.poseLandmarks.length > 0) {
                    drawSkeleton(result.poseLandmarks[0]);
                }
            }
            requestAnimationFrame(renderLoop);
        }

        function drawSkeleton(landmarks) {
            // Mapping connection arrays for full-body tracking linkages
            const connections = [
                [11, 12], [11, 13], [13, 15], [12, 14], [14, 16], // Shoulders and arms
                [11, 23], [12, 24], [23, 24],                     // Torso core frame
                [23, 25], [25, 27], [24, 26], [26, 28]              // Legs down to ankles
            ];

            // Render skeleton bone pathways
            ctx.lineWidth = 5;
            ctx.strokeStyle = '#00ff88'; // Vibrant neon green
            ctx.lineCap = 'round';

            connections.forEach(([start, end]) => {
                const ptA = landmarks[start];
                const ptB = landmarks[end];

                if (ptA && ptB && ptA.visibility > 0.5 && ptB.visibility > 0.5) {
                    ctx.beginPath();
                    ctx.moveTo(ptA.x * canvas.width, ptA.y * canvas.height);
                    ctx.lineTo(ptB.x * canvas.width, ptB.y * canvas.height);
                    ctx.stroke();
                }
            });

            // Render joint dots over the skeleton paths
            ctx.fillStyle = '#ffffff'; // Solid white nodes
            landmarks.forEach((kp, idx) => {
                // Focus tracking dots on body paths, skipping extra face clutter
                if (idx >= 11 && kp.visibility > 0.5) {
                    ctx.beginPath();
                    ctx.arc(kp.x * canvas.width, kp.y * canvas.height, 6, 0, 2 * Math.PI);
                    ctx.fill();
                }
            });
        }
    </script>
</body>
</html>
