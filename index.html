<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Body Tracker</title>
    <!-- Chart.js library for rendering progress graphs -->
    <script src="https://jsdelivr.net"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f4f5f6; padding: 20px; max-width: 600px; margin: auto; }
        .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 20px; }
        h1, h2 { color: #333; margin-top: 0; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
        button { background: #24292e; color: white; border: none; padding: 10px 15px; border-radius: 6px; cursor: pointer; width: 100%; font-size: 16px; }
        button:hover { background: #1f2327; }
    </style>
</head>
<body>

    <div class="card">
        <h1>Body Metrics Tracker</h1>
        <div class="form-group">
            <label for="weight">Weight (lbs/kg):</label>
            <input type="number" id="weight" step="0.1" placeholder="e.g. 175.4">
        </div>
        <div class="form-group">
            <label for="bodyfat">Body Fat % (Optional):</label>
            <input type="number" id="bodyfat" step="0.1" placeholder="e.g. 15.2">
        </div>
        <button onclick="logData()">Log Entry</button>
    </div>

    <div class="card">
        <h2>Progress Trend</h2>
        <canvas id="progressChart"></canvas>
    </div>

    <script>
        let trackerData = JSON.parse(localStorage.getItem('bodyTrackerData')) || [];
        let myChart;

        function initChart() {
            const ctx = document.getElementById('progressChart').getContext('2d');
            // Sort data by date before displaying
            trackerData.sort((a, b) => new Date(a.date) - new Date(b.date));
            
            const labels = trackerData.map(d => d.date);
            const weights = trackerData.map(d => d.weight);

            if(myChart) { myChart.destroy(); }

            myChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Weight Trend',
                        data: weights,
                        borderColor: '#24292e',
                        backgroundColor: 'rgba(36, 41, 46, 0.1)',
                        tension: 0.2,
                        fill: true
                    }]
                },
                options: { scales: { y: { beginAtZero: false } } }
            });
        }

        function logData() {
            const weightInput = document.getElementById('weight').value;
            const fatInput = document.getElementById('bodyfat').value;
            const today = new Date().toLocaleDateString();

            if (!weightInput) { alert('Please enter a weight value.'); return; }

            trackerData.push({
                date: today,
                weight: parseFloat(weightInput),
                fat: fatInput ? parseFloat(fatInput) : null
            });

            localStorage.setItem('bodyTrackerData', JSON.stringify(trackerData));
            initChart();
            
            document.getElementById('weight').value = '';
            document.getElementById('bodyfat').value = '';
        }

        // Load chart on page open
        window.onload = initChart;
    </script>
</body>
</html>
