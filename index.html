<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fixed Skeleton Tracker</title>
    
    <!-- Load required processing libraries in correct order -->
    <script src="https://jsdelivr.net"></script>
    <script src="https://jsdelivr.net"></script>
    <script src="https://jsdelivr.net"></script>

    <style>
        body { font-family: system-ui, sans-serif; background: #111; color: white; text-align: center; margin: 0; padding: 20px; }
        .container { position: relative; width: 640px; height: 480px; margin: 20px auto; background: #222; border-radius: 8px; border: 3px solid #333; }
        /* Keep video hidden so it doesn't block the visual canvas layers */
        video { display: none; }
        canvas { width: 640px; height: 480px; transform: scaleX(-1); border-radius: 5px; }
        #status { font-weight: bold; color: #00ff88; margin-top: 10px; font-size: 1.1rem; }
    </style>
</head>
<body>

    <h1>AI Body Skeleton Tracker</h1>
    <div id="status">Starting camera feed initialization...</div>

    <div class="container">
        <video id="webcam" autoplay playsinline muted></video>
        <canvas id="output"></canvas>
    </div>

    <script>
        let detector;
        let video = document.getElementById('webcam');
        let canvas = document.getElementById('output');
        let ctx = canvas.getContext('2d');

        async function main() {
            try {
                document.getElementById('status').innerText = 'Initializing WebGL Engine...';
                await tf.setBackend('webgl');
                
                document.getElementById('status').innerText = 'Downloading tracking model framework...';
                detector = await poseDetection.createDetector(poseDetection.SupportedModels.MoveNet, {
                    modelType: poseDetection.movenet.modelType.SINGLEPOSE_LIGHTNING
                });
                
                document.getElementById('status').innerText = 'Requesting camera system permissions...';
                await setupCamera();
                
                document.getElementById('status').innerText = 'Tracking fully active! Stand back.';
                
                canvas.width = 640;
                canvas.height = 480;
                
                trackLoop();
            } catch (err) {
                document.getElementById('status').innerText = 'Error detected: ' + err.message;
                console.error(err);
            }
        }

        async function setupCamera() {
            const stream = await navigator.mediaDevices.getUserMedia({
                video: { width: 640, height: 480 },
                audio: false
            });
            video.srcObject = stream;
            return new Promise((resolve) => {
                video.onloadedmetadata = () => { resolve(video); };
            });
        }

        async function trackLoop() {
            // Step 1: Force print the raw video frames onto the canvas display first
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

            // Step 2: Extract positional data arrays directly out of the generated canvas pixels
            if (detector) {
                const poses = await detector.estimatePoses(canvas);
                if (poses && poses.length > 0) {
                    drawBones(poses[0].keypoints);
                }
            }

            // Step 3: Loop infinitely
            requestAnimationFrame(trackLoop);
        }

        function drawBones(keypoints) {
            // Visual coordinate matching configurations for joints
            const lines = [
                ['left_shoulder', 'right_shoulder'], ['left_shoulder', 'left_elbow'],
                ['left_elbow', 'left_wrist'], ['right_shoulder', 'right_elbow'],
                ['right_elbow', 'right_wrist'], ['left_shoulder', 'left_hip'],
                ['right_shoulder', 'right_hip'], ['left_hip', 'right_hip'],
                ['left_hip', 'left_knee'], ['left_knee', 'left_ankle'],
                ['right_hip', 'right_knee'], ['right_knee', 'right_ankle']
            ];

            // Render skeleton vector strokes
            lines.forEach(([startPoint, endPoint]) => {
                const kp1 = keypoints.find(k => k.name === startPoint);
                const kp2 = keypoints.find(k => k.name === endPoint);

                if (kp1 && kp2 && kp1.score > 0.3 && kp2.score > 0.3) {
                    ctx.beginPath();
                    ctx.moveTo(kp1.x, kp1.y);
                    ctx.lineTo(kp2.x, kp2.y);
                    ctx.strokeStyle = '#00ff88'; // Neon green bones
                    ctx.lineWidth = 5;
                    ctx.stroke();
                }
            });

            // Render joint targets
            keypoints.forEach(kp => {
                if (kp.score > 0.3) {
                    ctx.beginPath();
                    ctx.arc(kp.x, kp.y, 6, 0, 2 * Math.PI);
                    ctx.fillStyle = '#ffffff'; // Bright white joints
                    ctx.fill();
                }
            });
        }

        window.onload = main;
    </script>
</body>
</html>
