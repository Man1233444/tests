<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>My First WebXR Game</title>
    <!-- Core A-Frame Engine (Only this single script is required) -->
    <script src="https://aframe.io"></script>
  </head>
  <body>
    <!-- The VR Scene -->
    <a-scene>
      
      <!-- Solid Color Sky (Replaces the broken forest extension) -->
      <a-sky color="#1A1A2E"></a-sky>

      <!-- A solid gray ground floor -->
      <a-plane position="0 0 -4" rotation="-90 0 0" width="100" height="100" color="#333333"></a-plane>

      <!-- 3D Shapes floating in front of you -->
      <a-box position="-1 0.75 -3" rotation="0 45 0" color="#4CC3D9"></a-box>
      <a-sphere position="0 1.5 -5" radius="1.25" color="#EF2D5E"></a-sphere>
      <a-cylinder position="1 0.75 -3" radius="0.5" height="1.5" color="#FFC65D"></a-cylinder>

      <!-- Tracked Quest Controllers -->
      
      

      <!-- Standard desktop view camera -->
      

    </a-scene>
  </body>
</html>
