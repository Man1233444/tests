<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fast AI Skeleton Tracker</title>
    
    <!-- Load TensorFlow.js core first -->
    <script src="https://jsdelivr.net"></script>
    <!-- Load the WebGL acceleration converter backend -->
    <script src="https://jsdelivr.net"></script>
    <!-- Load the unified pose-detection API shell -->
    <script src="https://jsdelivr.net"></script>

    <style>
        body { font-family: system-ui, sans-serif; background: #111; color: white; text-align: center; margin: 0; padding: 20px; }
        .container { position: relative; width: 640px; height: 480px; margin: 20px auto; background: #222; border-radius: 8px; overflow: hidden; }
        video, canvas { position: absolute; top: 0; left: 0; width: 640px; height: 480px; }
        canvas { z-index: 10; }
        #status { font-weight: bold; color: #00ff88; margin-top: 10px; }
    </style>
</head>
<body>

    <h1>AI Body Skeleton Tracker</h1>
    <div id="status">Starting setup routine...</div>

    <div class="container">
        <video id="webcam" autoplay playsinline muted style="transform: scaleX(-1);"></video>
        <canvas id="output" style="transform: scaleX(-1);"></canvas>
    </div>

    <script>
        let detector;
        let video = document.getElementById('webcam');
        let canvas = document.getElementById('output');
        let ctx = canvas.getContext('2d');

        async function main() {
            try {
                document.getElementById('status').innerText = '1/2: Loading lightweight AI model...';
                
                // Initialize the backend converter acceleration engine
                await tf.setBackend('webgl');
                
                // Use MoveNet which builds directly into the engine, preventing loop crashes
                const model = poseDetection.SupportedModels.MoveNet;
                detector = await poseDetection.createDetector(model, {
                    modelType: poseDetection.movenet.modelType.SINGLEPOSE_LIGHTNING
                });
                
                document.getElementById('status').innerText = '2/2: Requesting camera hardware permission...';
                await setupCamera();
                
                document.getElementById('status').innerText = 'Tracking online! Step fully into view.';
                
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                
                trackBody();
            } catch (err) {
                document.getElementById('status').innerText = 'Initialization Failed: ' + err.message;
                console.error(err);
            }
        }

        async function setupCamera() {
            const stream = await navigator.mediaDevices.getUserMedia({
                video: { width: 640, height: 480 },
                audio: false
            });
            video.srcObject = stream;
            return new Promise((resolve) => {
                video.onloadedmetadata = () => { resolve(video); };
            });
        }

        async function trackBody() {
            if (!detector) return;
            
            const poses = await detector.estimatePoses(video);
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (poses && poses.length > 0) {
                drawSkeleton(poses[0].keypoints);
            }

            requestAnimationFrame(trackBody);
        }

        function drawSkeleton(keypoints) {
            // Draw joint dots if detector is confident
            keypoints.forEach(keypoint => {
                if (keypoint.score > 0.4) {
                    ctx.beginPath();
                    ctx.arc(keypoint.x, keypoint.y, 6, 0, 2 * Math.PI);
                    ctx.fillStyle = '#00ff88';
                    ctx.fill();
                }
            });

            // Connect specific joints mapping rules for basic human frame geometry
            const connections = [
                ['left_shoulder', 'right_shoulder'],
                ['left_shoulder', 'left_elbow'],
                ['left_elbow', 'left_wrist'],
                ['right_shoulder', 'right_elbow'],
                ['right_elbow', 'right_wrist'],
                ['left_shoulder', 'left_hip'],
                ['right_shoulder', 'right_hip'],
                ['left_hip', 'right_hip'],
                ['left_hip', 'left_knee'],
                ['left_knee', 'left_ankle'],
                ['right_hip', 'right_knee'],
                ['right_knee', 'right_ankle']
            ];

            connections.forEach(([partA, partB]) => {
                const kp1 = keypoints.find(k => k.name === partA);
                const kp2 = keypoints.find(k => k.name === partB);

                if (kp1 && kp2 && kp1.score > 0.4 && kp2.score > 0.4) {
                    ctx.beginPath();
                    ctx.moveTo(kp1.x, kp1.y);
                    ctx.lineTo(kp2.x, kp2.y);
                    ctx.strokeStyle = '#ffffff';
                    ctx.lineWidth = 4;
                    ctx.stroke();
                }
            });
        }

        window.onload = main;
    </script>
</body>
</html>
