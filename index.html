<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Skeleton Body Tracker</title>
    
    <!-- Load modern standalone MediaPipe Pose detection scripts from alternative fast servers -->
    <script src="https://jsdelivr.net" crossorigin="anonymous"></script>
    <script src="https://jsdelivr.net" crossorigin="anonymous"></script>

    <style>
        body { font-family: system-ui, sans-serif; background: #111; color: white; text-align: center; margin: 0; padding: 20px; }
        .box { position: relative; width: 640px; height: 480px; margin: 20px auto; background: #222; border-radius: 12px; overflow: hidden; border: 3px solid #333; }
        
        /* Mirror elements horizontally so it behaves like a natural reflection mirror */
        video, canvas { position: absolute; top: 0; left: 0; width: 640px; height: 480px; transform: scaleX(-1); }
        
        /* Set up standard layer order */
        video { z-index: 1; display: block; }
        canvas { z-index: 5; }
        
        .controls { margin-top: 15px; }
        button { background: #00ff88; color: #111; font-weight: bold; border: none; padding: 12px 24px; font-size: 1rem; border-radius: 6px; cursor: pointer; margin: 5px; }
        button:hover { background: #00cc6e; }
        button.toggle-btn { background: #333; color: white; border: 2px solid #555; }
        button.toggle-btn:hover { background: #444; }
        #status { font-weight: bold; color: #ffcc00; margin-top: 10px; font-size: 1.1rem; }
    </style>
</head>
<body>

    <h1>AI Body Skeleton Tracker</h1>
    <div id="status">Click "Start Tracker" to launch the camera...</div>

    <div class="controls">
        <button onclick="startTracker()">Start Tracker</button>
        <button class="toggle-btn" onclick="toggleCameraView()">Show/Hide Camera View</button>
    </div>

    <div class="box">
        <!-- Background Webcam Video Stream Layer -->
        <video id="webcam" playsinline muted></video>
        <!-- Foreground Neon Skeleton Tracking Layer -->
        <canvas id="output"></canvas>
    </div>

    <script>
        const video = document.getElementById('webcam');
        const canvas = document.getElementById('output');
        const ctx = canvas.getContext('2d');
        
        let poseEngine;
        let activeCamera;
        let isCameraVisible = true;

        function toggleCameraView() {
            isCameraVisible = !isCameraVisible;
            video.style.display = isCameraVisible ? 'block' : 'none';
        }

        async function startTracker() {
            document.getElementById('status').innerText = 'Waking up camera and setting configuration rules...';
            
            // 1. Initialize the ultra-stable alternative MediaPipe Pose constructor engine
            poseEngine = new Pose({
                locateFile: (file) => `https://jsdelivr.net{file}`
            });

            poseEngine.setOptions({
                modelComplexity: 1,
                smoothLandmarks: true,
                minDetectionConfidence: 0.5,
                minTrackingConfidence: 0.5
            });

            // 2. Direct data pipelines straight to our custom canvas painting routine
            poseEngine.onResults(onPoseResults);

            // 3. Connect hardware streams directly via MediaPipe's failproof native camera system
            activeCamera = new Camera(video, {
                onFrame: async () => {
                    await poseEngine.send({ image: video });
                },
                width: 640,
                height: 480
            });

            canvas.width = 640;
            canvas.height = 480;

            document.getElementById('status').innerText = 'Requesting camera system permission...';
            await activeCamera.start();
            document.getElementById('status').innerText = 'Tracking active! Stand fully back into frame.';
        }

        function onPoseResults(results) {
            // Wipe canvas frame dry so lines do not smudge or stack over time
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // If the camera view button is turned OFF, paint a solid background instead of video frames
            if (!isCameraVisible) {
                ctx.fillStyle = '#222';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            }

            // Return early if no human frame geometry is identified inside the pixels
            if (!results.poseLandmarks) return;

            const landmarks = results.poseLandmarks;

            // Explicit human frame map structure rule sets
            const connections = [
                [11, 12], [11, 13], [13, 15], // Left shoulder, arm pathways
                [12, 14], [14, 16],           // Right shoulder, arm pathways
                [11, 23], [12, 24], [23, 24], // Torso frame connections
                [23, 25], [25, 27],           // Left leg hips down to ankles
                [24, 26], [26, 28]            // Right leg hips down to ankles
            ];

            // Render skeleton vector pathways onto the canvas matrix overlay sheet
            ctx.lineWidth = 5;
            ctx.strokeStyle = '#00ff88'; // Neon Green bones
            ctx.lineCap = 'round';

            connections.forEach(([startIdx, endIdx]) => {
                const ptA = landmarks[startIdx];
                const ptB = landmarks[endIdx];

                // Ensure minimal threshold parameter layout markers are visible on screen
                if (ptA.visibility > 0.5 && ptB.visibility > 0.5) {
                    ctx.beginPath();
                    ctx.moveTo(ptA.x * canvas.width, ptA.y * canvas.height);
                    ctx.lineTo(ptB.x * canvas.width, ptB.y * canvas.height);
                    ctx.stroke();
                }
            });

            // Render matching white coordinates highlight node targets
            ctx.fillStyle = '#ffffff'; // Solid white dots
            landmarks.forEach((landmark) => {
                if (landmark.visibility > 0.5) {
                    ctx.beginPath();
                    ctx.arc(landmark.x * canvas.width, landmark.y * canvas.height, 6, 0, 2 * Math.PI);
                    ctx.fill();
                }
            });
        }
    </script>
</body>
</html>
