<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fixed Camera Skeleton Tracker</title>
    
    <!-- Load clean, standalone TensorFlow and Pose models directly -->
    <script src="https://jsdelivr.net"></script>
    <script src="https://jsdelivr.net"></script>
    <script src="https://jsdelivr.net"></script>
    <script src="https://jsdelivr.net"></script>

    <style>
        body { font-family: system-ui, sans-serif; background: #111; color: white; text-align: center; margin: 0; padding: 20px; }
        .box { position: relative; width: 640px; height: 480px; margin: 20px auto; background: #222; border-radius: 10px; overflow: hidden; border: 3px solid #333; }
        video { position: absolute; top:0; left:0; width: 640px; height: 480px; transform: scaleX(-1); }
        canvas { position: absolute; top:0; left:0; width: 640px; height: 480px; transform: scaleX(-1); z-index: 5; }
        button { background: #00ff88; color: #111; font-weight: bold; border: none; padding: 12px 24px; font-size: 1rem; border-radius: 6px; cursor: pointer; margin-top: 10px; }
        button:hover { background: #00cc6e; }
        #status { font-weight: bold; color: #ffcc00; margin-top: 10px; }
    </style>
</head>
<body>

    <h1>AI Body Skeleton Tracker</h1>
    <p>If your browser didn't prompt you, click the force button below:</p>
    <button onclick="startTracker()">Force Start Camera</button>
    <div id="status">Waiting for user command...</div>

    <div class="box">
        <video id="webcam" autoplay playsinline muted></video>
        <canvas id="output"></canvas>
    </div>

    <script>
        let detector;
        let video = document.getElementById('webcam');
        let canvas = document.getElementById('output');
        let ctx = canvas.getContext('2d');

        async function startTracker() {
            document.getElementById('status').innerText = 'Requesting hardware permission...';
            try {
                // Step 1: Force request camera stream first
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { width: 640, height: 480 },
                    audio: false
                });
                video.srcObject = stream;
                
                document.getElementById('status').innerText = 'Camera linked! Loading AI skeleton engine...';
                
                // Step 2: Initialize basic mathematical processing tools
                await tf.setBackend('webgl');
                detector = await poseDetection.createDetector(poseDetection.SupportedModels.MoveNet);
                
                canvas.width = 640;
                canvas.height = 480;
                document.getElementById('status').innerText = 'Active! Step into frame.';
                
                track();
            } catch (err) {
                document.getElementById('status').innerText = 'Blocked: ' + err.message + '. Check browser settings.';
                console.error(err);
            }
        }

        async function track() {
            if (detector && video.readyState >= 2) {
                const poses = await detector.estimatePoses(video);
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                
                if (poses && poses.length > 0) {
                    drawSkeleton(poses[0].keypoints);
                }
            }
            requestAnimationFrame(track);
        }

        function drawSkeleton(keypoints) {
            // Draw joint dots
            keypoints.forEach(kp => {
                if (kp.score > 0.4) {
                    ctx.beginPath();
                    ctx.arc(kp.x, kp.y, 6, 0, 2 * Math.PI);
                    ctx.fillStyle = '#ffffff';
                    ctx.fill();
                }
            });

            // Map paths for limbs
            const bones = [
                [5, 6], [5, 7], [7, 9], [6, 8], [8, 10],
                [5, 11], [6, 12], [11, 12], [11, 13], [13, 15], [12, 14], [14, 16]
            ];

            bones.forEach(([s, e]) => {
                const kp1 = keypoints[s];
                const kp2 = keypoints[e];
                if (kp1.score > 0.4 && kp2.score > 0.4) {
                    ctx.beginPath();
                    ctx.moveTo(kp1.x, kp1.y);
                    ctx.lineTo(kp2.x, kp2.y);
                    ctx.strokeStyle = '#00ff88';
                    ctx.lineWidth = 4;
                    ctx.stroke();
                }
            });
        }
    </script>
</body>
</html>
