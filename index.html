<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Skeleton Tracker Overlay</title>
    
    <!-- Load stable web processing AI engines -->
    <script src="https://jsdelivr.net"></script>
    <script src="https://jsdelivr.net"></script>
    <script src="https://jsdelivr.net"></script>

    <style>
        body { font-family: system-ui, sans-serif; background: #111; color: white; text-align: center; margin: 0; padding: 20px; }
        .box { position: relative; width: 640px; height: 480px; margin: 20px auto; background: #222; border-radius: 10px; overflow: hidden; border: 3px solid #333; }
        
        /* Mirror both layers horizontally to simulate a natural mirror view */
        video, canvas { position: absolute; top: 0; left: 0; width: 640px; height: 480px; transform: scaleX(-1); }
        
        /* Force the transparent skeleton canvas layer directly over the video channel */
        canvas { z-index: 10; pointer-events: none; }
        
        button { background: #00ff88; color: #111; font-weight: bold; border: none; padding: 12px 24px; font-size: 1rem; border-radius: 6px; cursor: pointer; margin-top: 10px; }
        button:hover { background: #00cc6e; }
        #status { font-weight: bold; color: #ffcc00; margin-top: 10px; }
    </style>
</head>
<body>

    <h1>AI Body Skeleton Tracker</h1>
    <button onclick="startTracker()">Start Tracker Camera</button>
    <div id="status">Click button to open camera feed...</div>

    <div class="box">
        <!-- Live webcam video stream background tracking layer -->
        <video id="webcam" autoplay playsinline muted></video>
        <!-- Canvas overlay layer explicitly drawing the skeletal frame geometry -->
        <canvas id="output"></canvas>
    </div>

    <script>
        let detector;
        let video = document.getElementById('webcam');
        let canvas = document.getElementById('output');
        let ctx = canvas.getContext('2d');

        async function startTracker() {
            document.getElementById('status').innerText = 'Waking up camera hardware...';
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { width: 640, height: 480 },
                    audio: false
                });
                video.srcObject = stream;
                
                document.getElementById('status').innerText = 'Camera awake. Initializing tracking math...';
                await tf.setBackend('webgl');
                
                detector = await poseDetection.createDetector(poseDetection.SupportedModels.MoveNet, {
                    modelType: poseDetection.movenet.modelType.SINGLEPOSE_LIGHTNING
                });
                
                canvas.width = 640;
                canvas.height = 480;
                document.getElementById('status').innerText = 'System Running! Stand back from the lens.';
                
                track();
            } catch (err) {
                document.getElementById('status').innerText = 'Initialization Error: ' + err.message;
                console.error(err);
            }
        }

        async function track() {
            // Wipe canvas frame so skeletal lines from previous frames do not stick or smudge
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Fetch live layout points from current camera frames
            if (detector && video.readyState >= 2) {
                const poses = await detector.estimatePoses(video);
                
                if (poses && poses.length > 0) {
                    drawSkeleton(poses[0].keypoints);
                }
            }
            requestAnimationFrame(track);
        }

        function drawSkeleton(keypoints) {
            // FIXED: Complete explicit skeletal mapping pathways for bone layout tracking
            const connections = [
                ['left_shoulder', 'right_shoulder'], ['left_shoulder', 'left_elbow'],
                ['left_elbow', 'left_wrist'], ['right_shoulder', 'right_elbow'],
                ['right_elbow', 'right_wrist'], ['left_shoulder', 'left_hip'],
                ['right_shoulder', 'right_hip'], ['left_hip', 'right_hip'],
                ['left_hip', 'left_knee'], ['left_knee', 'left_ankle'],
                ['right_hip', 'right_knee'], ['right_knee', 'right_ankle']
            ];

            // Render skeleton vector pathways
            connections.forEach(([jointA, jointB]) => {
                const pt1 = keypoints.find(k => k.name === jointA);
                const pt2 = keypoints.find(k => k.name === jointB);

                // Check minimal confidence scoring layout parameter restrictions
                if (pt1 && pt2 && pt1.score > 0.3 && pt2.score > 0.3) {
                    ctx.beginPath();
                    ctx.moveTo(pt1.x, pt1.y);
                    ctx.lineTo(pt2.x, pt2.y);
                    ctx.strokeStyle = '#00ff88'; // Neon Green lines
                    ctx.lineWidth = 5;
                    ctx.stroke();
                }
            });

            // Render joint targets
            keypoints.forEach(kp => {
                if (kp.score > 0.3) {
                    ctx.beginPath();
                    ctx.arc(kp.x, kp.y, 6, 0, 2 * Math.PI);
                    ctx.fillStyle = '#ffffff'; // White joint nodes
                    ctx.fill();
                }
            });
        }
    </script>
</body>
</html>
