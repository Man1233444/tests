<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Body Skeleton Tracker</title>
    
    <!-- Load TensorFlow.js and MediaPipe Pose models from CDN -->
    <script src="https://jsdelivr.net"></script>
    <script src="https://jsdelivr.net"></script>
    <script src="https://jsdelivr.net"></script>
    <script src="https://jsdelivr.net"></script>

    <style>
        body { font-family: system-ui, sans-serif; background: #111; color: white; text-align: center; margin: 0; padding: 20px; }
        .container { position: relative; width: 640px; height: 480px; margin: 20px auto; background: #222; border-radius: 8px; overflow: hidden; }
        video, canvas { position: absolute; top: 0; left: 0; width: 640px; height: 480px; }
        canvas { z-index: 10; }
        #status { font-weight: bold; color: #00ff88; margin-top: 10px; }
    </style>
</head>
<body>

    <h1>AI Body Skeleton Tracker</h1>
    <div id="status">Loading machine learning models... Please wait.</div>

    <div class="container">
        <!-- Webcam input element (hidden visually but active for data) -->
        <video id="webcam" autoplay playsinline muted style="transform: scaleX(-1);"></video>
        <!-- Overlay canvas where the skeleton is drawn -->
        <canvas id="output" style="transform: scaleX(-1);"></canvas>
    </div>

    <script>
        let detector;
        let video = document.getElementById('webcam');
        let canvas = document.getElementById('output');
        let ctx = canvas.getContext('2d');

        // Main entry point to launch webcam and AI tracking
        async function main() {
            try {
                // Initialize the MediaPipe Pose detector
                const model = poseDetection.SupportedModels.BlazePose;
                detector = await poseDetection.createDetector(model, {
                    runtime: 'mediapipe',
                    solutionPath: 'https://jsdelivr.net'
                });
                
                document.getElementById('status').innerText = 'Model Loaded! Requesting webcam access...';
                await setupCamera();
                
                document.getElementById('status').innerText = 'Tracking active! Stand back so the camera sees your body.';
                
                // Match visual display resolutions
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                
                trackBody();
            } catch (err) {
                document.getElementById('status').innerText = 'Error: ' + err.message;
                console.error(err);
            }
        }

        // Connect the user's webcam hardware to the video tag
        async function setupCamera() {
            const stream = await navigator.mediaDevices.getUserMedia({
                video: { width: 640, height: 480 },
                audio: false
            });
            video.srcObject = stream;
            return new Promise((resolve) => {
                video.onloadedmetadata = () => { resolve(video); };
            });
        }

        // Recursive loop that tracks positions frame by frame
        async function trackBody() {
            const poses = await detector.estimatePoses(video);
            
            // Clear previous canvas frame
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (poses.length > 0) {
                const keypoints = poses[0].keypoints;
                drawSkeleton(keypoints);
            }

            // Continuously request the next framework refresh
            requestAnimationFrame(trackBody);
        }

        // Renders visual joints and connecting lines on screen
        function drawSkeleton(keypoints) {
            // Draw joint dots
            keypoints.forEach(keypoint => {
                if (keypoint.score > 0.5) { // Only draw if confident
                    ctx.beginPath();
                    ctx.arc(keypoint.x, keypoint.y, 6, 0, 2 * Math.PI);
                    ctx.fillStyle = '#00ff88';
                    ctx.fill();
                }
            });

            // Connect lines between major matching joint pairs
            const connections = poseDetection.util.getAdjacentPairs(poseDetection.SupportedModels.BlazePose);
            connections.forEach(([i, j]) => {
                const kp1 = keypoints[i];
                const kp2 = keypoints[j];
                
                if (kp1.score > 0.5 && kp2.score > 0.5) {
                    ctx.beginPath();
                    ctx.moveTo(kp1.x, kp1.y);
                    ctx.lineTo(kp2.x, kp2.y);
                    ctx.strokeStyle = '#ffffff';
                    ctx.lineWidth = 3;
                    ctx.stroke();
                }
            });
        }

        // Run setup routine on page load
        window.onload = main;
    </script>
</body>
</html>
