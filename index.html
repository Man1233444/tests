<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Skeleton Tracker Overlay</title>
    
    <!-- Load stable p5.js and ml5.js library tools -->
    <script src="https://cloudflare.com"></script>
    <script src="https://unpkg.com"></script>

    <style>
        body { font-family: system-ui, sans-serif; background: #111; color: white; text-align: center; margin: 0; padding: 20px; }
        #container { display: inline-block; margin-top: 20px; border: 3px solid #333; border-radius: 12px; overflow: hidden; background: #222; position: relative; }
        #status { font-weight: bold; color: #ffcc00; margin-top: 10px; font-size: 1.2rem; }
    </style>
</head>
<body>

    <h1>AI Body Skeleton Tracker</h1>
    <div id="status">Loading tracking engine... Please wait.</div>
    
    <div id="container"></div>

    <script>
        let video;
        let bodyPose;
        let poses = [];

        function preload() {
            // Load the stable tracking model frame
            bodyPose = ml5.bodyPose('MoveNet', { modelType: 'LIGHTNING' });
        }

        function setup() {
            // Create a canvas display window and nest it inside the HTML container
            let canvas = createCanvas(640, 480);
            canvas.parent('container');

            // Boot up camera hardware
            video = createCapture(VIDEO);
            video.size(640, 480);
            video.hide(); // Hide the extra un-mirrored raw video box

            // Fire the automated tracking logic loop
            bodyPose.detectStart(video, gotPoses);
        }

        function draw() {
            // Mirror everything horizontally so it acts like a normal reflection
            translate(width, 0);
            scale(-1, 1);

            // Draw the camera image directly onto the screen matrix
            image(video, 0, 0, width, height);

            // If a human is detected, map out the skeletal system coordinates
            if (poses.length > 0) {
                document.getElementById('status').innerText = 'Tracking active! Stand back.';
                drawSkeleton(poses[0]);
            }
        }

        function gotPoses(results) {
            poses = results;
            if (poses.length > 0) {
                document.getElementById('status').innerText = 'Body Detected!';
            }
        }

        function drawSkeleton(pose) {
            // Fetch the connecting bones list automatically built into the engine
            let skeleton = bodyPose.getSkeleton(pose);

            // Render matching green skeleton lines
            stroke(0, 255, 136); // Neon Green lines
            strokeWeight(5);
            for (let i = 0; i < skeleton.length; i++) {
                let ptA = skeleton[i][0];
                let ptB = skeleton[i][1];
                line(ptA.x, ptA.y, ptB.x, ptB.y);
            }

            // Render joint dots
            fill(255, 255, 255); // Solid white points
            noStroke();
            for (let i = 0; i < pose.keypoints.length; i++) {
                let kp = pose.keypoints[i];
                if (kp.confidence > 0.3) {
                    circle(kp.x, kp.y, 10);
                }
            }
        }
    </script>
</body>
</html>
