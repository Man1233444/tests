<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instant AI Skeleton Tracker</title>
    
    <!-- Load highly reliable p5.js and ml5.js animation frameworks -->
    <script src="https://cloudflare.com"></script>
    <script src="https://unpkg.com"></script>

    <style>
        body { font-family: system-ui, sans-serif; background: #111; color: white; text-align: center; margin: 0; padding: 20px; }
        #canvas-holder { display: inline-block; margin-top: 20px; border: 4px solid #333; border-radius: 12px; overflow: hidden; background: #222; }
        #status { font-weight: bold; color: #00ff88; margin-top: 10px; font-size: 1.2rem; }
    </style>
</head>
<body>

    <h1>Instant AI Skeleton Tracker</h1>
    <div id="status">Loading stable body tracker engine...</div>
    
    <!-- Container where the automated video system injects itself -->
    <div id="canvas-holder"></div>

    <script>
        let video;
        let bodyPose;
        let poses = [];

        // Runs first to pull up dependencies
        function preload() {
            // Load the stable, quick-response MoveNet lightning model
            bodyPose = ml5.bodyPose('MoveNet', { modelType: 'LIGHTNING' });
        }

        // Sets up layout screen variables automatically
        function setup() {
            // Create a clean canvas display and nest it in our custom HTML container
            let canvas = createCanvas(640, 480);
            canvas.parent('canvas-holder');

            // Hook up webcam hardware
            video = createCapture(VIDEO);
            video.size(640, 480);
            video.hide(); // Hide raw input; we will manually mirror and paint it

            // Fire tracking routine continuously on the feed
            bodyPose.detectStart(video, gotPoses);
        }

        // Visual loop executing at 60 frames per second
        function draw() {
            // Step 1: Flip coordinates horizontally to mirror your movement naturally
            translate(width, 0);
            scale(-1, 1);

            // Step 2: Draw the webcam image frame onto the background canvas matrix
            image(video, 0, 0, width, height);

            // Step 3: Check if a physical human frame has been verified by the AI
            if (poses.length > 0) {
                let currentPose = poses[0];
                document.getElementById('status').innerText = 'System Running! Step back into frame.';
                
                drawSkeletonBones(currentPose);
                drawJointDots(currentPose);
            }
        }

        // Realtime data callback pipeline
        function gotPoses(results) {
            poses = results;
            if(poses.length > 0) {
                 document.getElementById('status').innerText = 'Body Detected!';
            }
        }

        // Connect the skeleton lines between joint structures
        function drawSkeletonBones(pose) {
            stroke(0, 255, 136); // Neon Green lines
            strokeWeight(5);

            // Pre-built skeleton connections mapping list inside ml5
            if (bodyPose.skeleton) {
                let skeleton = bodyPose.getSkeleton(pose);
                for (let i = 0; i < skeleton.length; i++) {
                    let partA = skeleton[i][0];
                    let partB = skeleton[i][1];
                    // Render vectors connecting coordinate anchors
                    line(partA.x, partA.y, partB.x, partB.y);
                }
            }
        }

        // Overlay bright points over the active bones
        function drawJointDots(pose) {
            fill(255, 255, 255); // Solid white centers
            noStroke();
            
            for (let i = 0; i < pose.keypoints.length; i++) {
                let kp = pose.keypoints[i];
                // Only draw a tracking circle if the AI model threshold confidence is met
                if (kp.confidence > 0.3) {
                    circle(kp.x, kp.y, 12);
                }
            }
        }
    </script>
</body>
</html>
