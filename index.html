<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fixed Skeleton Tracking</title>
    
    <!-- Load stable, explicit versions of the TensorFlow AI engine -->
    <script src="https://jsdelivr.net"></script>
    <script src="https://jsdelivr.net"></script>
    <script src="https://jsdelivr.net"></script>

    <style>
        body { font-family: system-ui, sans-serif; background: #111; color: white; text-align: center; margin: 0; padding: 20px; }
        .box { position: relative; width: 640px; height: 480px; margin: 20px auto; background: #222; border-radius: 10px; overflow: hidden; border: 3px solid #333; }
        video { display: none; } /* Hide raw feed to prevent double vision overlay glitches */
        canvas { width: 640px; height: 480px; transform: scaleX(-1); } /* Mirror naturally */
        button { background: #00ff88; color: #111; font-weight: bold; border: none; padding: 12px 24px; font-size: 1rem; border-radius: 6px; cursor: pointer; margin-top: 10px; }
        button:hover { background: #00cc6e; }
        #status { font-weight: bold; color: #ffcc00; margin-top: 10px; }
    </style>
</head>
<body>

    <h1>AI Body Skeleton Tracker</h1>
    <button onclick="startTracker()">Start Tracker</button>
    <div id="status">Click button to initialize webcam stream...</div>

    <div class="box">
        <video id="webcam" autoplay playsinline muted></video>
        <canvas id="output"></canvas>
    </div>

    <script>
        let detector;
        let video = document.getElementById('webcam');
        let canvas = document.getElementById('output');
        let ctx = canvas.getContext('2d');

        async function startTracker() {
            document.getElementById('status').innerText = 'Initializing camera access pipeline...';
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { width: 640, height: 480 },
                    audio: false
                });
                video.srcObject = stream;
                
                document.getElementById('status').innerText = 'Camera connected. Booting AI core engine...';
                await tf.setBackend('webgl');
                
                // Load explicit single-pose tracker to isolate data frames instantly
                detector = await poseDetection.createDetector(poseDetection.SupportedModels.MoveNet, {
                    modelType: poseDetection.movenet.modelType.SINGLEPOSE_LIGHTNING
                });
                
                canvas.width = 640;
                canvas.height = 480;
                document.getElementById('status').innerText = 'Tracking active! Stand back to see skeleton.';
                
                track();
            } catch (err) {
                document.getElementById('status').innerText = 'Error: ' + err.message;
                console.error(err);
            }
        }

        async function track() {
            // Force paint the live camera data directly onto the matrix sheet
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

            if (detector && video.readyState >= 2) {
                const poses = await detector.estimatePoses(canvas);
                
                if (poses && poses.length > 0) {
                    drawSkeleton(poses[0].keypoints);
                }
            }
            requestAnimationFrame(track);
        }

        function drawSkeleton(keypoints) {
            // Explicit human frame map structure rules
            const connections = [
                ['left_shoulder', 'right_shoulder'],
                ['left_shoulder', 'left_elbow'],
                ['left_elbow', 'left_wrist'],
                ['right_shoulder', 'right_elbow'],
                ['right_elbow', 'right_wrist'],
                ['left_shoulder', 'left_hip'],
                ['right_shoulder', 'right_hip'],
                ['left_hip', 'right_hip'],
                ['left_hip', 'left_knee'],
                ['left_knee', 'left_ankle'],
                ['right_hip', 'right_knee'],
                ['right_knee', 'right_ankle']
            ];

            // Render skeleton vector pathways
            connections.forEach(([jointA, jointB]) => {
                const pt1 = keypoints.find(k => k.name === jointA);
                const pt2 = keypoints.find(k => k.name === jointB);

                // Only draw if both joint nodes match confidence layout minimums
                if (pt1 && pt2 && pt1.score > 0.3 && pt2.score > 0.3) {
                    ctx.beginPath();
                    ctx.moveTo(pt1.x, pt1.y);
                    ctx.lineTo(pt2.x, pt2.y);
                    ctx.strokeStyle = '#00ff88'; // Neon green bones
                    ctx.lineWidth = 5;
                    ctx.stroke();
                }
            });

            // Draw joint dot markers
            keypoints.forEach(kp => {
                if (kp.score > 0.3) {
                    ctx.beginPath();
                    ctx.arc(kp.x, kp.y, 6, 0, 2 * Math.PI);
                    ctx.fillStyle = '#ffffff'; // White joint targets
                    ctx.fill();
                }
            });
        }
    </script>
</body>
</html>
