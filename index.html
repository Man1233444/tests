<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Skeleton Body Tracker</title>
    
    <!-- Load stable p5.js and ml5.js animation frameworks -->
    <script src="https://cloudflare.com"></script>
    <script src="https://unpkg.com"></script>

    <style>
        body { font-family: system-ui, sans-serif; background: #111; color: white; text-align: center; margin: 0; padding: 20px; }
        #canvas-container { display: inline-block; margin-top: 20px; border: 3px solid #333; border-radius: 12px; overflow: hidden; background: #222; }
        .controls { margin-top: 15px; }
        button { background: #00ff88; color: #111; font-weight: bold; border: none; padding: 12px 24px; font-size: 1rem; border-radius: 6px; cursor: pointer; margin: 5px; }
        button:hover { background: #00cc6e; }
        #status { font-weight: bold; color: #ffcc00; margin-top: 10px; font-size: 1.1rem; }
    </style>
</head>
<body>

    <h1>AI Body Skeleton Tracker</h1>
    <div id="status">Loading tracking engine... Please wait.</div>

    <div class="controls">
        <button onclick="toggleCameraView()">Show/Hide Camera View</button>
    </div>

    <!-- The container where your tracking screen will appear -->
    <div id="canvas-container"></div>

    <script>
        let video;
        let bodyPose;
        let poses = [];
        let showCamera = true;

        function preload() {
            // Load the stable, instant-start tracking engine
            bodyPose = ml5.bodyPose();
        }

        function setup() {
            // Create the matching viewing window canvas
            let canvas = createCanvas(640, 480);
            canvas.parent('canvas-container');

            // Turn on the webcam hardware instantly
            video = createCapture(VIDEO);
            video.size(640, 480);
            video.hide(); // Hide extra layout layers

            // Start analyzing the body structure positions automatically
            bodyPose.detectStart(video, gotPoses);
        }

        function draw() {
            // Mirror coordinates horizontally so it behaves like a normal reflective mirror
            translate(width, 0);
            scale(-1, 1);

            if (showCamera) {
                // Paint the live camera view onto the background canvas sheet
                image(video, 0, 0, width, height);
            } else {
                // Clear background screen to solid grey if camera is toggled off
                background(34);
            }

            // Draw the skeleton lines and white joint points on top
            if (poses.length > 0) {
                document.getElementById('status').innerText = 'System Live! Stand back from the lens.';
                drawSkeletonLines();
                drawJointDots();
            }
        }

        // Save fresh tracking information as you move around
        function gotPoses(results) {
            poses = results;
            if (poses.length > 0) {
                document.getElementById('status').innerText = 'Body Detected!';
            }
        }

        // Turn the camera layer visibility on or off when clicking the button
        function toggleCameraView() {
            showCamera = !showCamera;
        }

        function drawSkeletonLines() {
            stroke(0, 255, 136); // Neon Green bones
            strokeWeight(5);

            // Fetch the connecting bones list automatically built into the engine
            let skeleton = bodyPose.getSkeleton(poses);

            for (let i = 0; i < skeleton.length; i++) {
                let ptA = skeleton[i];
                let ptB = skeleton[i];
                line(ptA.x, ptA.y, ptB.x, ptB.y);
            }
        }

        function drawJointDots() {
            fill(255, 255, 255); // Solid white joints
            noStroke();
            
            let keypoints = poses.keypoints;
            for (let i = 0; i < keypoints.length; i++) {
                let kp = keypoints[i];
                // Only paint tracking dots if the connection layout confidence is high enough
                if (kp.confidence > 0.2) {
                    circle(kp.x, kp.y, 10);
                }
            }
        }
    </script>
</body>
</html>
